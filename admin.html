<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración – Coro Infantil OCGC</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1">
    <link rel="icon" type="image/png" href="assets/logo_OCGC_simple.png">
</head>

<body>
    <div class="container admin-container">
        <!-- Login -->
        <section id="login-section">
            <div class="login-card">
                <div class="header-logo">
                    <img src="assets/logo_OCGC.png" alt="Logo OCGC">
                </div>
                <h2>Panel de inscripciones</h2>
                <p class="description" style="text-align:center; margin-bottom: 24px;">
                    Coro Infantil OCGC · El Señor de los Anillos
                </p>

                <div id="loginError" class="login-error" role="alert"></div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required
                            autocomplete="current-password">
                    </div>
                    <button type="submit" id="loginBtn">Entrar</button>
                </form>
            </div>
        </section>

        <!-- Dashboard -->
        <section id="dashboard-section" class="hidden">
            <div class="dashboard-header">
                <div>
                    <h2>Inscripciones Coro Infantil
                        <span class="subtitle">Pruebas de acceso · 10 de diciembre</span>
                    </h2>
                </div>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <a class="btn btn-secondary" href="index.html" target="_blank" rel="noopener">Ver formulario</a>
                    <button class="btn btn-secondary" id="refreshBtn">Actualizar</button>
                    <button class="btn" id="logoutBtn">Cerrar sesión</button>
                </div>
            </div>

            <div class="toolbar">
                <div class="field">
                    <label for="searchInput">Buscar</label>
                    <input type="search" id="searchInput" placeholder="Nombre, email o teléfono">
                </div>
                <div class="field">
                    <label for="filterSlot">Franja de audición</label>
                    <select id="filterSlot">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div class="field">
                    <label for="filterRehearsal">Disponibilidad de ensayos</label>
                    <select id="filterRehearsal">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div class="field">
                    <label for="filterExperience">Experiencia previa</label>
                    <select id="filterExperience">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div class="actions">
                    <button class="btn btn-secondary" id="clearFiltersBtn">Limpiar filtros</button>
                    <button class="btn btn-gold" id="exportCsvBtn">Exportar CSV</button>
                    <button class="btn btn-gold" id="exportExcelBtn">Exportar Excel</button>
                    <button class="btn btn-gold" id="exportPdfBtn">Exportar PDF</button>
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Adulto responsable</th>
                            <th>Parentesco</th>
                            <th>Teléfono</th>
                            <th>Email</th>
                            <th>Aspirante</th>
                            <th>Nacimiento</th>
                            <th>Edad</th>
                            <th>Experiencia</th>
                            <th>Franja</th>
                            <th>Ensayos</th>
                            <th>Autoriza</th>
                            <th>Datos</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="responsesBody"></tbody>
                </table>
            </div>

            <div class="table-footer" id="tableFooter"></div>
        </section>
    </div>

    <!-- Modal de detalle -->
    <div id="detailModal" class="modal-overlay hidden" role="dialog" aria-modal="true"
        aria-labelledby="detailTitle">
        <div class="modal-card">
            <div class="modal-head">
                <h3 id="detailTitle">Detalle de la inscripción</h3>
                <button class="modal-close" id="detailClose" aria-label="Cerrar">&times;</button>
            </div>
            <div class="modal-body">
                <dl class="detail-grid" id="detailBody"></dl>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
    <script type="module" src="admin.js?v=1"></script>
</body>

</html>
